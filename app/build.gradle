plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.astrodice.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.astrodice.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
        buildConfigField "String", "MOONSHOT_API_KEY", "\"${localProps.getProperty('moonshot.api.key', '')}\""
        buildConfigField "String", "MOONSHOT_MODEL", "\"${localProps.getProperty('moonshot.model', 'kimi-k2.6')}\""
    }

    buildToolsVersion '34.0.0'

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/astrodice.keystore")
            storePassword localProps.getProperty('keystore.store.password', '')
            keyAlias localProps.getProperty('keystore.key.alias', 'astrodice')
            keyPassword localProps.getProperty('keystore.key.password', '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
